<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Plume Connect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="container">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">
        <i class="fas fa-feather-alt"></i> Plume Connect
      </a>
      <div class="navbar-actions">
        <span id="user-name" style="color:var(--text-secondary);font-size:0.875rem;font-weight:500;"></span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Выйти
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- MAIN -->
<main class="container" style="padding-top:100px;padding-bottom:60px;">
  <h1 style="font-size:2rem;font-weight:800;margin-bottom:24px;">
    <i class="fas fa-bolt" style="color:var(--accent);"></i> Личный кабинет
  </h1>

  <!-- TABS -->
  <div class="tabs" style="display:flex;gap:8px;margin-bottom:24px;border-bottom:1px solid var(--border);overflow-x:auto;">
    <button class="tab active" onclick="switchTab('plans')" style="padding:12px 20px;background:none;border:none;color:var(--text-primary);font-weight:600;font-size:0.9rem;cursor:pointer;border-bottom:2px solid var(--accent);white-space:nowrap;">
      📦 Тарифы
    </button>
    <button class="tab" onclick="switchTab('subscriptions')" style="padding:12px 20px;background:none;border:none;color:var(--text-secondary);font-weight:600;font-size:0.9rem;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;">
      🔄 Мои подписки
    </button>
    <button class="tab" onclick="switchTab('devices')" style="padding:12px 20px;background:none;border:none;color:var(--text-secondary);font-weight:600;font-size:0.9rem;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;">
      📱 Устройства
    </button>
  </div>

  <!-- TAB CONTENT -->
  <div id="tab-plans" class="tab-content">
    <div class="plans-grid" id="plans-container">
      <p style="color:var(--text-secondary);">Загрузка тарифов...</p>
    </div>
  </div>
  <div id="tab-subscriptions" class="tab-content" style="display:none;">
    <div id="subscriptions-container">
      <p style="color:var(--text-secondary);">Загрузка подписок...</p>
    </div>
  </div>
  <div id="tab-devices" class="tab-content" style="display:none;">
    <div id="devices-container">
      <p style="color:var(--text-secondary);">Загрузка устройств...</p>
    </div>
  </div>
</main>

<!-- SCRIPTS -->
<script src="app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
