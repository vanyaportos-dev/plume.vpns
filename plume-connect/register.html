<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Создайте аккаунт в Plume Connect — VPN нового поколения" />
  <title>Регистрация — Plume Connect</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🪶</text></svg>" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Декоративный фон -->
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-grid-bg"></div>
    <div class="auth-orb-1"></div>
    <div class="auth-orb-2"></div>
  </div>

  <!-- Основной контент -->
  <main class="auth-page" role="main">
    <div class="auth-card" role="region" aria-label="Форма регистрации">

      <!-- Логотип -->
      <a href="/" class="auth-logo" aria-label="Plume Connect — на главную">
        <i class="fas fa-feather-alt" aria-hidden="true"></i>
        Plume Connect
      </a>

      <!-- Заголовок -->
      <h1 class="auth-title">Создать аккаунт</h1>
      <p class="auth-subtitle">Начните пользоваться VPN прямо сейчас</p>

      <!-- Глобальный алерт -->
      <div id="reg-alert" role="alert" aria-live="assertive"></div>

      <!-- Форма -->
      <form id="register-form" class="auth-form" novalidate aria-label="Форма регистрации">

        <!-- Имя -->
        <div class="form-group">
          <label class="form-label" for="reg-name">Ваше имя</label>
          <div class="form-input-wrap">
            <input
              type="text"
              id="reg-name"
              name="name"
              class="form-input"
              placeholder="Иван Иванов"
              autocomplete="name"
              required
              aria-required="true"
              aria-describedby="reg-name-error"
            />
            <i class="fas fa-user form-input-icon" aria-hidden="true"></i>
          </div>
          <span class="form-error" id="reg-name-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="reg-email">Email</label>
          <div class="form-input-wrap">
            <input
              type="email"
              id="reg-email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              inputmode="email"
              required
              aria-required="true"
              aria-describedby="reg-email-error"
            />
            <i class="fas fa-envelope form-input-icon" aria-hidden="true"></i>
          </div>
          <span class="form-error" id="reg-email-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Пароль -->
        <div class="form-group">
          <label class="form-label" for="reg-password">Пароль</label>
          <div class="form-input-wrap">
            <input
              type="password"
              id="reg-password"
              name="password"
              class="form-input"
              placeholder="Минимум 6 символов"
              autocomplete="new-password"
              required
              aria-required="true"
              aria-describedby="reg-password-error"
            />
            <i class="fas fa-lock form-input-icon" aria-hidden="true"></i>
            <button type="button" class="form-password-toggle" aria-label="Показать / скрыть пароль" tabindex="-1">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <span class="form-error" id="reg-password-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Подтверждение пароля -->
        <div class="form-group">
          <label class="form-label" for="reg-confirm">Подтвердите пароль</label>
          <div class="form-input-wrap">
            <input
              type="password"
              id="reg-confirm"
              name="confirm_password"
              class="form-input"
              placeholder="Повторите пароль"
              autocomplete="new-password"
              required
              aria-required="true"
              aria-describedby="reg-confirm-error"
            />
            <i class="fas fa-lock form-input-icon" aria-hidden="true"></i>
            <button type="button" class="form-password-toggle" aria-label="Показать / скрыть пароль" tabindex="-1">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <span class="form-error" id="reg-confirm-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Кнопка -->
        <button type="submit" id="reg-submit" class="btn btn-primary btn-block btn-lg">
          <i class="fas fa-user-plus" aria-hidden="true"></i>
          <span>Создать аккаунт</span>
        </button>

        <!-- Дополнительный текст -->
        <p style="font-size:0.78rem;color:var(--text-secondary);text-align:center;line-height:1.5;">
          Создавая аккаунт, вы соглашаетесь с
          <a href="/terms" style="color:var(--accent);">условиями использования</a>
          и
          <a href="/privacy" style="color:var(--accent);">политикой конфиденциальности</a>
        </p>

      </form>

      <!-- Разделитель -->
      <div class="auth-divider" aria-hidden="true">
        <span class="auth-divider-line"></span>
        <span class="auth-divider-text">или</span>
        <span class="auth-divider-line"></span>
      </div>

      <!-- Telegram Login Widget -->
      <div class="auth-telegram-wrap" aria-label="Зарегистрироваться через Telegram">
        <script
          async
          src="https://telegram.org/js/telegram-widget.js?22"
          data-telegram-login="plumecrobot"
          data-size="large"
          data-userpic="true"
          data-radius="12"
          data-auth-url="https://plume-vpns.vercel.app/api/auth/telegram"
          data-request-access="write"
        ></script>
      </div>

      <!-- Ссылка на вход -->
      <div class="auth-footer">
        Уже есть аккаунт?
        <a href="/login">Войти</a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script src="auth.js"></script>

</body>
</html>
