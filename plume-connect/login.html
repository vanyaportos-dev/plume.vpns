<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Войдите в Plume Connect — VPN нового поколения" />
  <title>Войти — Plume Connect</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🪶</text></svg>" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Декоративный фон -->
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-grid-bg"></div>
    <div class="auth-orb-1"></div>
    <div class="auth-orb-2"></div>
  </div>

  <!-- Основной контент -->
  <main class="auth-page" role="main">
    <div class="auth-card" role="region" aria-label="Форма входа">

      <!-- Логотип -->
      <a href="/" class="auth-logo" aria-label="Plume Connect — на главную">
        <i class="fas fa-feather-alt" aria-hidden="true"></i>
        Plume Connect
      </a>

      <!-- Заголовок -->
      <h1 class="auth-title">С возвращением!</h1>
      <p class="auth-subtitle">Войдите в свой аккаунт</p>

      <!-- Глобальный алерт -->
      <div id="login-alert" role="alert" aria-live="assertive"></div>

      <!-- Форма -->
      <form id="login-form" class="auth-form" novalidate aria-label="Форма входа">

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <div class="form-input-wrap">
            <input
              type="email"
              id="login-email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              inputmode="email"
              required
              aria-required="true"
              aria-describedby="login-email-error"
            />
            <i class="fas fa-envelope form-input-icon" aria-hidden="true"></i>
          </div>
          <span class="form-error" id="login-email-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Пароль -->
        <div class="form-group">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
            <label class="form-label" for="login-password" style="margin-bottom:0;">Пароль</label>
            <a href="#" style="font-size:0.8rem;color:var(--accent);font-weight:500;" tabindex="-1">
              Забыли пароль?
            </a>
          </div>
          <div class="form-input-wrap">
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-input"
              placeholder="Минимум 6 символов"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="login-password-error"
            />
            <i class="fas fa-lock form-input-icon" aria-hidden="true"></i>
            <button type="button" class="form-password-toggle" aria-label="Показать / скрыть пароль" tabindex="-1">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <span class="form-error" id="login-password-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Кнопка -->
        <button type="submit" id="login-submit" class="btn btn-primary btn-block btn-lg">
          <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
          <span>Войти</span>
        </button>

      </form>

      <!-- Разделитель -->
      <div class="auth-divider" aria-hidden="true">
        <span class="auth-divider-line"></span>
        <span class="auth-divider-text">или</span>
        <span class="auth-divider-line"></span>
      </div>

      <!-- Telegram Login Widget -->
      <div class="auth-telegram-wrap" aria-label="Войти через Telegram">
        <script
          async
          src="https://telegram.org/js/telegram-widget.js?22"
          data-telegram-login="plumecrobot"
          data-size="large"
          data-userpic="true"
          data-radius="12"
          data-auth-url="https://plume-vpns.vercel.app/api/auth/telegram"
          data-request-access="write"
        ></script>
      </div>

      <!-- Ссылка на регистрацию -->
      <div class="auth-footer">
        Нет аккаунта?
        <a href="/register">Зарегистрироваться</a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script src="auth.js"></script>

</body>
</html>
